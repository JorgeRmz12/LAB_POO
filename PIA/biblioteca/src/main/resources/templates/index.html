<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Biblioteca</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">📚 Sistema Biblioteca</h1>

    <div class="text-end mb-3">
        <a href="/nuevo" class="btn btn-primary">➕ Agregar Libro</a>
    </div>

    <table class="table table-bordered table-hover shadow bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Año</th>
            <th>Categoría</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="libro : ${listaLibros}">
            <td th:text="${libro.id}"></td>
            <td th:text="${libro.titulo}"></td>
            <td th:text="${libro.autor}"></td>
            <td th:text="${libro.anio}"></td>
            <td th:text="${libro.categoria}"></td>
            <td>
                <a th:href="@{/editar/{id}(id=${libro.id})}"
                   class="btn btn-warning btn-sm">Editar</a>

                <a th:href="@{/eliminar/{id}(id=${libro.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Eliminar libro?')">Eliminar</a>
            </td>
        </tr>
        </tbody>

    </table>

</div>

</body>
</html>
