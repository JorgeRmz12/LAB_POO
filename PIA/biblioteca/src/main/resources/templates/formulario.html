<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Libro</title>
</head>
<body>

<h1>Registro de Libro</h1>

<form th:action="@{/guardar}" th:object="${libro}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Título:</label>
    <input type="text" th:field="*{titulo}" required>
    <br><br>

    <label>Autor:</label>
    <input type="text" th:field="*{autor}" required>
    <br><br>

    <label>Año:</label>
    <input type="number" th:field="*{anio}" required>
    <br><br>

    <label>Categoría:</label>
    <input type="text" th:field="*{categoria}" required>
    <br><br>

    <button type="submit">Guardar</button>

</form>

<br>
<a href="/">Volver</a>

</body>
</html>
